<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>点击显示文字效果</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 600px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            padding: 30px;
            text-align: center;
        }
        
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }
        
        .description {
            color: #666;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .clickable-text {
            background-color: #f5f5f5;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px 20px;
            margin: 15px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 18px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 2px;
        }
        
        .clickable-text:hover {
            background-color: #e9e9e9;
            border-color: #bbb;
        }
        
        .clickable-text:active {
            transform: scale(0.98);
        }
        
        .hidden-text {
            color: transparent;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.3);
        }
        
        .revealed-text {
            color: #333;
            text-shadow: none;
        }
        
        .mask {
            color: #333;
        }
        
        .instruction {
            margin-top: 20px;
            color: #777;
            font-style: italic;
        }
        
        .counter {
            margin-top: 15px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>点击显示文字效果</h1>
        <p class="description">点击下面的文本区域，可以看到隐藏的内容。再次点击将恢复隐藏状态。</p>
        
        <div class="clickable-text" id="text1">
            <span class="mask">■■■■■■■■■■■■■■■■■■■■</span>
            <span class="hidden-text">这是一个隐藏的文本内容，只有点击时才会显示。</span>
        </div>
        
        <div class="clickable-text" id="text2">
            <span class="mask">■■■■■■■■■■■■■■■■■■■■</span>
            <span class="hidden-text">这是第二个隐藏文本，包含更多内容。你可以在这里放置任何想要隐藏的信息。</span>
        </div>
        
        <div class="clickable-text" id="text3">
            <span class="mask">■■■■■■■■■■■■■■■■■■■■</span>
            <span class="hidden-text">JavaScript 是一种强大的脚本语言，可以创建动态交互效果。</span>
        </div>
        
        <p class="instruction">点击任意文本区域查看效果</p>
        <p class="counter">点击次数: <span id="clickCount">0</span></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const clickableTexts = document.querySelectorAll('.clickable-text');
            const clickCountElement = document.getElementById('clickCount');
            let clickCount = 0;
            
            clickableTexts.forEach(textElement => {
                textElement.addEventListener('click', function() {
                    const mask = this.querySelector('.mask');
                    const hiddenText = this.querySelector('.hidden-text');
                    
                    if (mask.style.display !== 'none') {
                        // 显示隐藏文本
                        mask.style.display = 'none';
                        hiddenText.classList.remove('hidden-text');
                        hiddenText.classList.add('revealed-text');
                    } else {
                        // 恢复方块显示
                        mask.style.display = 'inline';
                        hiddenText.classList.remove('revealed-text');
                        hiddenText.classList.add('hidden-text');
                    }
                    
                    // 更新点击计数
                    clickCount++;
                    clickCountElement.textContent = clickCount;
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        /* ... 之前的CSS样式保持不变 ... */
        .notion-text-reveal {
            max-width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.5;
            color: #333333;
        }
        
        .editor-section {
            background: #fbfbfa;
            border-radius: 4px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #e0e0e0;
            transition: all 0.3s ease;
        }
        
        .editor-section.collapsed {
            max-height: 60px;
            overflow: hidden;
            cursor: pointer;
        }
        
        .editor-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #000000;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .title-text {
            flex: 1;
        }
        
        .toggle-btn {
            background: #333333;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
        }
        
        .text-item {
            margin-bottom: 20px;
            padding: 16px;
            background: white;
            border-radius: 4px;
            border: 1px solid #f0f0f0;
        }
        
        .text-input-section {
            margin-bottom: 12px;
        }
        
        .text-input {
            width: 100%;
            padding: 8px 12px;
            border: 1px solid #666666;
            border-radius: 3px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            min-height: 60px;
            margin-bottom: 8px;
            background: white;
            color: #333333;
        }
        
        .text-input:focus {
            outline: none;
            border-color: #4c6ef5;
        }
        
        .selection-instruction {
            font-size: 12px;
            color: #666666;
            margin-bottom: 8px;
        }
        
        .hidden-parts-list {
            margin-top: 12px;
        }
        
        .hidden-part-item {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            padding: 6px 8px;
            background: #f5f5f5;
            border-radius: 3px;
        }
        
        .hidden-text {
            flex: 1;
            font-size: 13px;
            color: #666666;
        }
        
        .remove-hidden {
            color: #ff6b6b;
            cursor: pointer;
            font-size: 12px;
            padding: 2px 6px;
            border-radius: 2px;
        }
        
        .remove-hidden:hover {
            background: #ffebee;
        }
        
        .mask-selector {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 12px 0;
        }
        
        .mask-option {
            padding: 4px 8px;
            border: 1px solid #666666;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            background: white;
            color: #333333;
        }
        
        .mask-option:hover {
            background: #f8f9fa;
        }
        
        .mask-option.active {
            background: #333333;
            color: white;
            border-color: #333333;
        }
        
        .item-actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }
        
        .btn {
            padding: 6px 12px;
            border: 1px solid #666666;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            background: white;
            color: #333333;
        }
        
        .btn-primary {
            background: #333333;
            color: white;
            border-color: #333333;
        }
        
        .btn:hover {
            background: #f8f9fa;
        }
        
        .btn-primary:hover {
            background: #555555;
        }
        
        .preview-section {
            margin-top: 20px;
        }
        
        .preview-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: #000000;
        }
        
        .preview-text {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 16px;
            padding: 12px;
            background: white;
            border-radius: 4px;
            border: 1px solid #f0f0f0;
            color: #333333;
        }
        
        .masked-part {
            background: #f5f5f5;
            padding: 2px 6px;
            border-radius: 3px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
            margin: 0 1px;
            font-family: monospace;
            display: inline-block;
        }
        
        .masked-part:hover {
            background: #f1f3f5;
            border-color: #e9ecef;
        }
        
        .masked-part.revealed {
            background: #333333;
            color: white;
            border-color: #333333;
        }
        
        .mask {
            letter-spacing: 1px;
            color: #666666;
            font-family: monospace;
        }
        
        .content {
            display: none;
        }
        
        .revealed .mask {
            display: none;
        }
        
        .revealed .content {
            display: inline;
        }
        
        .selection-tools {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        
        .selection-btn {
            padding: 4px 8px;
            border: 1px solid #666666;
            border-radius: 3px;
            cursor: pointer;
            font-size: 11px;
            background: white;
            color: #333333;
        }
        
        .selection-btn:hover {
            background: #f8f9fa;
        }
        
        /* 全屏模式样式 */
        .fullscreen-mode {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: white;
            z-index: 1000;
            padding: 60px 40px 40px;
            overflow-y: auto;
            box-sizing: border-box;
        }
        
        .fullscreen-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1001;
        }
        
        .exit-fullscreen {
            background: #333333;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        
        .fullscreen-content {
            max-width: 800px;
            margin: 0 auto;
            font-size: 16px;
            line-height: 1.6;
        }
        
        .fullscreen-text {
            margin-bottom: 20px;
            padding: 20px;
            background: white;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="notion-text-reveal">
        <!-- 编辑器部分 -->
        <div class="editor-section" id="editorSection">
            <div class="editor-title">
                <span class="title-text">编辑文本内容</span>
                <button class="toggle-btn" onclick="toggleEditor()">完成编辑</button>
            </div>
            
            <div id="editor-container">
                <!-- 项目1 -->
                <div class="text-item" data-index="0">
                    <div class="text-input-section">
                        <textarea class="text-input" placeholder="输入完整的文本内容..." oninput="updatePreview(0)">这是一个示例文本，其中某些部分可以被隐藏。</textarea>
                        <div class="selection-instruction">选中文本后点击"标记为隐藏"来设置隐藏部分</div>
                        <div class="selection-tools">
                            <button class="selection-btn" onclick="markAsHidden(0)">标记为隐藏</button>
                            <button class="selection-btn" onclick="clearSelection(0)">清除选择</button>
                        </div>
                    </div>
                    
                    <div class="hidden-parts-list" id="hidden-parts-0">
                        <!-- 隐藏部分列表 -->
                    </div>
                    
                    <div class="mask-selector">
                        <div class="mask-option active" data-mask="■" onclick="setMaskType(0, '■')">■ 方块</div>
                        <div class="mask-option" data-mask="●" onclick="setMaskType(0, '●')">● 圆点</div>
                        <div class="mask-option" data-mask="□" onclick="setMaskType(0, '□')">□ 空心</div>
                        <div class="mask-option" data-mask="*" onclick="setMaskType(0, '*')">* 星号</div>
                    </div>
                    
                    <div class="item-actions">
                        <button class="btn" onclick="removeItem(0)">删除此项</button>
                    </div>
                </div>
            </div>
            
            <div class="item-actions">
                <button class="btn btn-primary" onclick="addNewItem()">+ 添加新文本</button>
            </div>
        </div>
        
        <!-- 预览部分 -->
        <div class="preview-section" id="previewSection">
            <div class="preview-title">预览效果</div>
            <div id="preview-container">
                <!-- 预览内容将通过JavaScript动态生成 -->
            </div>
        </div>
    </div>

    <script>
        let items = [
            { 
                text: '这是一个示例文本，其中某些部分可以被隐藏。',
                hiddenParts: [
                    { start: 5, end: 7, text: '示例' },
                    { start: 13, end: 17, text: '某些部分' }
                ],
                maskType: '■'
            }
        ];

        let isEditorCollapsed = false;
        let isFullscreen = false;

        // 标记选中的文本为隐藏
        function markAsHidden(index) {
            const textInput = document.querySelector(`[data-index="${index}"] .text-input`);
            const selection = getSelectionText(textInput);
            
            if (selection.text && selection.start !== selection.end) {
                // 检查是否重叠
                const newPart = {
                    start: selection.start,
                    end: selection.end,
                    text: selection.text
                };
                
                if (!isOverlapping(items[index].hiddenParts, newPart)) {
                    items[index].hiddenParts.push(newPart);
                    updateHiddenPartsList(index);
                    updatePreview(index);
                }
            }
        }

        // 获取选中的文本
        function getSelectionText(textarea) {
            const start = textarea.selectionStart;
            const end = textarea.selectionEnd;
            const text = textarea.value.substring(start, end);
            return { start, end, text };
        }

        // 检查是否重叠
        function isOverlapping(parts, newPart) {
            return parts.some(part => 
                (newPart.start >= part.start && newPart.start < part.end) ||
                (newPart.end > part.start && newPart.end <= part.end) ||
                (newPart.start <= part.start && newPart.end >= part.end)
            );
        }

        // 更新隐藏部分列表
        function updateHiddenPartsList(index) {
            const container = document.getElementById(`hidden-parts-${index}`);
            container.innerHTML = '';
            
            items[index].hiddenParts.forEach((part, partIndex) => {
                const partItem = document.createElement('div');
                partItem.className = 'hidden-part-item';
                partItem.innerHTML = `
                    <span class="hidden-text">"${part.text}"</span>
                    <span class="remove-hidden" onclick="removeHiddenPart(${index}, ${partIndex})">删除</span>
                `;
                container.appendChild(partItem);
            });
        }

        // 移除隐藏部分
        function removeHiddenPart(itemIndex, partIndex) {
            items[itemIndex].hiddenParts.splice(partIndex, 1);
            updateHiddenPartsList(itemIndex);
            updatePreview(itemIndex);
        }

        // 清除选择
        function clearSelection(index) {
            const textInput = document.querySelector(`[data-index="${index}"] .text-input`);
            textInput.setSelectionRange(0, 0);
        }

        // 设置遮盖符号类型
        function setMaskType(index, maskType) {
            items[index].maskType = maskType;
            
            // 更新UI
            const maskOptions = document.querySelectorAll(`[data-index="${index}"] .mask-option`);
            maskOptions.forEach(option => {
                option.classList.toggle('active', option.dataset.mask === maskType);
            });
            
            updatePreview(index);
        }

        // 计算遮盖符号数量 - 精确匹配字符数
        function calculateMaskCount(text) {
            // 直接使用文本字符数作为遮盖符号数量
            return Math.max(2, text.length);
        }

        // 生成预览文本
        function generatePreviewText(item) {
            const { text, hiddenParts, maskType } = item;
            
            if (hiddenParts.length === 0) {
                return [{ type: 'text', content: text }];
            }
            
            // 按位置排序隐藏部分
            const sortedParts = [...hiddenParts].sort((a, b) => a.start - b.start);
            const parts = [];
            let lastIndex = 0;
            
            sortedParts.forEach(part => {
                // 添加前面的普通文本
                if (part.start > lastIndex) {
                    parts.push({
                        type: 'text',
                        content: text.substring(lastIndex, part.start)
                    });
                }
                
                // 计算遮盖符号数量 - 精确匹配字符数
                const maskCount = calculateMaskCount(part.text);
                const mask = maskType.repeat(maskCount);
                
                parts.push({
                    type: 'mask',
                    content: mask,
                    originalText: part.text
                });
                
                lastIndex = part.end;
            });
            
            // 添加剩余文本
            if (lastIndex < text.length) {
                parts.push({
                    type: 'text',
                    content: text.substring(lastIndex)
                });
            }
            
            return parts;
        }

        // 创建可点击的文本元素
        function createClickableTextElement(part) {
            if (part.type === 'text') {
                const span = document.createElement('span');
                span.textContent = part.content;
                return span;
            } else {
                const maskedSpan = document.createElement('span');
                maskedSpan.className = 'masked-part';
                maskedSpan.innerHTML = `
                    <span class="mask">${part.content}</span>
                    <span class="content">${part.originalText}</span>
                `;
                // 添加点击事件
                maskedSpan.addEventListener('click', function() {
                    this.classList.toggle('revealed');
                });
                return maskedSpan;
            }
        }

        // 初始化预览
        function initializePreview() {
            const previewContainer = document.getElementById('preview-container');
            previewContainer.innerHTML = '';
            
            items.forEach((item, index) => {
                const previewText = document.createElement('div');
                previewText.className = 'preview-text';
                
                const parts = generatePreviewText(item);
                
                parts.forEach(part => {
                    const element = createClickableTextElement(part);
                    previewText.appendChild(element);
                });
                
                previewContainer.appendChild(previewText);
            });
        }

        // 更新预览
        function updatePreview(index) {
            const textInput = document.querySelector(`[data-index="${index}"] .text-input`);
            items[index].text = textInput.value;
            
            // 移除超出文本范围的隐藏部分
            items[index].hiddenParts = items[index].hiddenParts.filter(part => 
                part.end <= items[index].text.length
            );
            
            updateHiddenPartsList(index);
            initializePreview();
        }

        // 添加新项目
        function addNewItem() {
            const newIndex = items.length;
            items.push({ 
                text: '新的文本内容', 
                hiddenParts: [],
                maskType: '■'
            });
            
            const editorContainer = document.getElementById('editor-container');
            const newItem = document.createElement('div');
            newItem.className = 'text-item';
            newItem.setAttribute('data-index', newIndex);
            newItem.innerHTML = `
                <div class="text-input-section">
                    <textarea class="text-input" placeholder="输入完整的文本内容..." oninput="updatePreview(${newIndex})">新的文本内容</textarea>
                    <div class="selection-instruction">选中文本后点击"标记为隐藏"来设置隐藏部分</div>
                    <div class="selection-tools">
                        <button class="selection-btn" onclick="markAsHidden(${newIndex})">标记为隐藏</button>
                        <button class="selection-btn" onclick="clearSelection(${newIndex})">清除选择</button>
                    </div>
                </div>
                
                <div class="hidden-parts-list" id="hidden-parts-${newIndex}"></div>
                
                <div class="mask-selector">
                    <div class="mask-option active" data-mask="■" onclick="setMaskType(${newIndex}, '■')">■ 方块</div>
                    <div class="mask-option" data-mask="●" onclick="setMaskType(${newIndex}, '●')">● 圆点</div>
                    <div class="mask-option" data-mask="□" onclick="setMaskType(${newIndex}, '□')">□ 空心</div>
                    <div class="mask-option" data-mask="*" onclick="setMaskType(${newIndex}, '*')">* 星号</div>
                </div>
                
                <div class="item-actions">
                    <button class="btn" onclick="removeItem(${newIndex})">删除此项</button>
                </div>
            `;
            
            editorContainer.appendChild(newItem);
            initializePreview();
        }

        // 删除项目
        function removeItem(index) {
            if (items.length > 1) {
                items.splice(index, 1);
                const editorContainer = document.getElementById('editor-container');
                editorContainer.innerHTML = '';
                
                // 重新创建编辑器
                items.forEach((item, newIndex) => {
                    const textItem = document.createElement('div');
                    textItem.className = 'text-item';
                    textItem.setAttribute('data-index', newIndex);
                    textItem.innerHTML = `
                        <div class="text-input-section">
                            <textarea class="text-input" placeholder="输入完整的文本内容..." oninput="updatePreview(${newIndex})">${item.text}</textarea>
                            <div class="selection-instruction">选中文本后点击"标记为隐藏"来设置隐藏部分</div>
                            <div class="selection-tools">
                                <button class="selection-btn" onclick="markAsHidden(${newIndex})">标记为隐藏</button>
                                <button class="selection-btn" onclick="clearSelection(${newIndex})">清除选择</button>
                            </div>
                        </div>
                        
                        <div class="hidden-parts-list" id="hidden-parts-${newIndex}"></div>
                        
                        <div class="mask-selector">
                            <div class="mask-option ${item.maskType === '■' ? 'active' : ''}" data-mask="■" onclick="setMaskType(${newIndex}, '■')">■ 方块</div>
                            <div class="mask-option ${item.maskType === '●' ? 'active' : ''}" data-mask="●" onclick="setMaskType(${newIndex}, '●')">● 圆点</div>
                            <div class="mask-option ${item.maskType === '□' ? 'active' : ''}" data-mask="□" onclick="setMaskType(${newIndex}, '□')">□ 空心</div>
                            <div class="mask-option ${item.maskType === '*' ? 'active' : ''}" data-mask="*" onclick="setMaskType(${newIndex}, '*')">* 星号</div>
                        </div>
                        
                        <div class="item-actions">
                            <button class="btn" onclick="removeItem(${newIndex})">删除此项</button>
                        </div>
                    `;
                    editorContainer.appendChild(textItem);
                    updateHiddenPartsList(newIndex);
                });
                
                initializePreview();
            }
        }

        // 切换编辑器显示/隐藏
        function toggleEditor() {
            const editorSection = document.getElementById('editorSection');
            const previewSection = document.getElementById('previewSection');
            
            if (isEditorCollapsed) {
                // 展开编辑器
                editorSection.classList.remove('collapsed');
                previewSection.style.display = 'block';
                document.querySelector('.toggle-btn').textContent = '完成编辑';
                isEditorCollapsed = false;
                exitFullscreen();
            } else {
                // 收起编辑器
                editorSection.classList.add('collapsed');
                previewSection.style.display = 'none';
                document.querySelector('.toggle-btn').textContent = '展开编辑';
                isEditorCollapsed = true;
                enterFullscreen();
            }
        }

        // 进入全屏模式
        function enterFullscreen() {
            // 先清理可能存在的全屏元素
            exitFullscreen();
            
            const fullscreenDiv = document.createElement('div');
            fullscreenDiv.className = 'fullscreen-mode';
            fullscreenDiv.id = 'fullscreenView';
            
            // 创建全屏内容容器
            const contentDiv = document.createElement('div');
            contentDiv.className = 'fullscreen-content';
            contentDiv.id = 'fullscreenContent';
            
            // 生成全屏内容
            items.forEach((item, index) => {
                const textDiv = document.createElement('div');
                textDiv.className = 'fullscreen-text';
                
                const parts = generatePreviewText(item);
                parts.forEach(part => {
                    const element = createClickableTextElement(part);
                    textDiv.appendChild(element);
                });
                
                contentDiv.appendChild(textDiv);
            });
            
            fullscreenDiv.appendChild(contentDiv);
            
            // 添加退出按钮
            const controlsDiv = document.createElement('div');
            controlsDiv.className = 'fullscreen-controls';
            controlsDiv.innerHTML = '<button class="exit-fullscreen" id="exitFullscreenBtn">退出全屏</button>';
            
            document.body.appendChild(controlsDiv);
            document.body.appendChild(fullscreenDiv);
            isFullscreen = true;
            
            // 直接绑定退出按钮事件
            document.getElementById('exitFullscreenBtn').addEventListener('click', exitFullscreen);
        }

        // 退出全屏模式
        function exitFullscreen() {
            console.log('退出全屏函数被调用'); // 调试信息
            
            const fullscreenView = document.getElementById('fullscreenView');
            const controls = document.querySelector('.fullscreen-controls');
            
            if (fullscreenView) {
                console.log('找到全屏视图元素，准备移除');
                fullscreenView.remove();
            } else {
                console.log('未找到全屏视图元素');
            }
            
            if (controls) {
                console.log('找到控制按钮，准备移除');
                controls.remove();
            }
            
            isFullscreen = false;
            
            // 如果编辑器是收起的，展开它
            if (isEditorCollapsed) {
                console.log('编辑器处于收起状态，准备展开');
                const editorSection = document.getElementById('editorSection');
                const previewSection = document.getElementById('previewSection');
                
                editorSection.classList.remove('collapsed');
                previewSection.style.display = 'block';
                document.querySelector('.toggle-btn').textContent = '完成编辑';
                isEditorCollapsed = false;
            }
            
            console.log('退出全屏完成');
        }

        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            items.forEach((item, index) => {
                updateHiddenPartsList(index);
            });
            initializePreview();
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        .notion-text-reveal {
            max-width: 100%;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.5;
        }
        
        .reveal-item {
            background: transparent;
            border: 1px solid #e0e0e0;
            border-radius: 3px;
            padding: 8px 12px;
            margin: 6px 0;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 14px;
            line-height: 1.5;
            user-select: none;
        }
        
        .reveal-item:hover {
            background: #f8f9fa;
            border-color: #d0d0d0;
        }
        
        .reveal-item.revealed {
            background: #f0f7ff;
            border-color: #4c6ef5;
        }
        
        .mask {
            letter-spacing: 1.5px;
            color: #666;
            font-size: 13px;
        }
        
        .content {
            display: none;
            color: #37352f;
            font-size: 14px;
        }
        
        .revealed .mask {
            display: none;
        }
        
        .revealed .content {
            display: block;
        }
    </style>
</head>
<body>
    <div class="notion-text-reveal">
        <div class="reveal-item" onclick="toggleText(this)">
            <span class="mask">■■■■■■■■■■■■■■■■■■■■</span>
            <span class="content">这是一个隐藏的文本内容，只有点击时才会显示。</span>
        </div>
        
        <div class="reveal-item" onclick="toggleText(this)">
            <span class="mask">■■■■■■■■■■■■■■■■■■■■■■■■■■■■</span>
            <span class="content">这是第二个隐藏文本，包含更多内容。你可以在这里放置任何想要隐藏的信息。</span>
        </div>
        
        <div class="reveal-item" onclick="toggleText(this)">
            <span class="mask">■■■■■■■■■■■■■■■■■■■■■■■■</span>
            <span class="content">JavaScript 是一种强大的脚本语言，可以创建动态交互效果。</span>
        </div>
    </div>

    <script>
        function toggleText(element) {
            element.classList.toggle('revealed');
        }
    </script>
</body>
</html>
